name: Mac AnyDesk Remote

on:
  workflow_dispatch: # Manual run

jobs:
  anydesk:
    runs-on: macos-latest
    timeout-minutes: 360 # 6 ghante max

    steps:
      - name: Install AnyDesk
        run: |
          # AnyDesk dmg download
          curl -L -o anydesk.dmg "https://download.anydesk.com/mac/anydesk.dmg"
          hdiutil attach anydesk.dmg
          cp -R "/Volumes/AnyDesk/AnyDesk.app" /Applications/
          hdiutil detach "/Volumes/AnyDesk"

      - name: Grant Permissions
        run: |
          # Screen Recording permission deni padegi warna black screen aayega
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
          "INSERT or REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.anydesk.anydesk',0,1,1,NULL,'UNUSED',NULL,0,1640000);"
          
          # Accessibility permission
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
          "INSERT or REPLACE INTO access VALUES('kTCCServiceAccessibility','com.anydesk.anydesk',0,1,1,NULL,'UNUSED',NULL,0,1640000);"

      - name: Start AnyDesk Unattended
        run: |
          # Unattended access on + password set
          PASSWORD="Anydesk@123"  # apna strong password yaha daalo
          
          /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --install
          /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --set-password "$PASSWORD"
          /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --enable-service
          /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --start-service
          
          sleep 5 # ID generate hone do
          
          # AnyDesk ID nikalna
          ANYDESK_ID=$(/Applications/AnyDesk.app/Contents/MacOS/AnyDesk --get-id)
          
          echo "================================"
          echo "AnyDesk ID: $ANYDESK_ID"
          echo "Password: $PASSWORD"
          echo "================================"
          echo "Android par AnyDesk app kholo aur ye ID daal do"

      - name: Keep Alive
        run: |
          echo "Runner 6 ghante tak on rahega..."
          while true; do sleep 60; done
